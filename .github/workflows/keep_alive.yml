name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright and ping Streamlit
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
          node -e '
          const { chromium } = require("playwright");
          
          const urls = [
            "https://freddy-skills-queries-tools.streamlit.app/"
          ];

          (async () => {
            const browser = await chromium.launch();
            for (const url of urls) {
              console.log("Checking:", url);
              const page = await browser.newPage();
              await page.goto(url, { waitUntil: "networkidle", timeout: 60000 });
              
              const wakeButton = page.locator("button:has-text(\"get this app back up\")");
              if (await wakeButton.count() > 0) {
                console.log("Waking up:", url);
                await wakeButton.click();
                await page.waitForTimeout(15000);
              } else {
                console.log("Already awake:", url);
                await page.waitForTimeout(5000);
              }
              await page.close();
            }
            await browser.close();
          })();
          '
