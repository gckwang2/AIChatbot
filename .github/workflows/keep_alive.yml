import asyncio
from playwright.async_api import async_playwright

STREAMLIT_URL = "https://freddy-skills-queries-tools.streamlit.app/"


async def keep_awake():
    async with async_playwright() as p:
        browser = await p.chromium.launch(headless=True)
        page = await browser.new_page()
        try:
            await page.goto(
                STREAMLIT_URL, wait_until="networkidle", timeout=60000
            )

            # Look for the sleep screen wake-up button
            wake_btn = page.locator("button:has-text('get this app back up')")
            if await wake_btn.count() > 0:
                print("App was sleeping. Clicking wake button...")
                await wake_btn.click()
                await page.wait_for_timeout(15000)  # Wait for container boot
            else:
                print("App is already awake. Holding WebSocket open...")
                await page.wait_for_timeout(5000)

        except Exception as e:
            print(f"Error pinging Streamlit: {e}")
        finally:
            await browser.close()


if __name__ == "__main__":
    asyncio.run(keep_awake())

